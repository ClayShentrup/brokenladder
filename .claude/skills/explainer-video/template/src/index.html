<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer</title>
<style>
  :root { --bg: #1d1b22; --fg: #f8f1e3; --accent: #e4572e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #ui { width: min(100%, calc((100vh - 110px) * 16 / 9)); display: flex; align-items: center; gap: 12px; }
  #play { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 16px; cursor: pointer; min-width: 92px; }
  #ui.playing #play::after { content: "Pause"; } #ui:not(.playing) #play::after { content: "Play"; }
  #seek { flex: 1; height: 10px; background: rgba(255,255,255,.15); border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; }
  #bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; font-size: 14px; opacity: .8; min-width: 92px; text-align: right; }
  .hint { font-size: 12px; opacity: .55; }
  body.render { padding: 0; background: #000; } body.render #ui, body.render .hint { display: none; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play" aria-label="Play or pause"></button><div id="seek"><div id="bar"></div></div><span id="time">0:00</span></div>
<div class="hint">space: play/pause · ←/→: 5s · c: captions</div>
<script>if (location.search.includes('render')) document.body.classList.add('render');</script>
<script src="vendor/rough.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
